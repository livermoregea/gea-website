<title id="title">Love waves wiggle the ground sideways</title>
<desc id="description">A view looking down at the ground. A blue arrow points right, showing where the wave travels. Colorful patches of ground shift across that direction. A teal double arrow points toward the top and bottom of the page to show horizontal side-to-side motion, not vertical bouncing.</desc>
